# OpenResty / nginx server block for Future Studio.
# (https://github.com/futurelyf/future-studio-web)
#
# Copy this `server { ... }` block into your OpenResty config (e.g.
# /usr/local/openresty/nginx/conf/conf.d/futurestudio.conf) and replace
# the placeholder `root` path with your real value.
#
# SSL is handled upstream by 1Panel, so this block listens on plain HTTP
# on port 80. Point 1Panel's reverse proxy at this port.

server {
    listen 80;
    listen [::]:80;
    server_name futurestudio.dev www.futurestudio.dev;

    # Path to the cloned repo on the server.
    root /opt/1panel/1panel/www/sites/futurestudio.dev/index;
    index index.html;

    # 1) Try the requested URI as a file, then as a directory (which resolves
    #    to its index.html via the `index` directive), then try appending .html
    #    (so legacy /contact.html links keep working for a transition window).
    #    The trailing =404 is reached only if none of the above exist.
    #    No trailing-slash rewrite is needed: 1Panel's reverse proxy already
    #    normalizes /contact → /contact/, and try_files serves both forms.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 2) Serve the 404 page directly for /not-found (and /not-found/ if 1Panel
    #    appends a trailing slash). This intercepts the request before the
    #    catch-all try_files can re-trigger the error_page redirect, which
    #    would otherwise loop when 1Panel normalizes the redirect target.
    location ~ ^/not-found/?$ {
        try_files /not-found.html =404;
    }

    # 3) 404 page. The "=302" makes this an external redirect (changes the URL
    #    bar to /not-found), so users always land on the canonical 404 URL
    #    rather than the non-existent one they typed.
    error_page 404 =302 /not-found;
}

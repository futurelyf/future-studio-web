<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <link rel="icon" type="image/svg+xml" href="pic/Tree.svg" />
    <link rel="stylesheet" href="style.css" />
    <script>
      (function () {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <header class="navbar">
      <div class="navbar__inner">
        <a href="/" class="brand">
          <img
            src="pic/Tree.svg"
            alt="Future Studio logo"
            class="brand__logo"
          />
          <span class="brand__name">Future Studio</span>
        </a>
        <nav class="navbar__links">
          <a href="/">Home</a>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle dark or light mode"
          >
            <svg
              class="icon icon--sun"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg
              class="icon icon--moon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="notfound">
      <div class="notfound__content">
        <h1 class="notfound__title">
          Page not found
          <img
            class="notfound__emoji"
            src="pic/knocked-out_face_animated.png"
            alt=""
            aria-hidden="true"
          />
        </h1>
        <p class="notfound__desc">
          Sorry, the page you're looking for doesn't exist or may have moved.
        </p>
        <a href="/" class="cta">
          Go to home page
          <span class="cta__icon">
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="7" y1="17" x2="17" y2="7" />
              <polyline points="8 7 17 7 17 16" />
            </svg>
          </span>
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer__box">
        <a href="/" class="brand">
          <img
            src="pic/Tree.svg"
            alt="Future Studio logo"
            class="brand__logo"
          />
          <span class="brand__name">Future Studio</span>
        </a>
        <div class="footer__text">
          <p>Future Studio</p>
          <p>© <span class="year"></span> Yifan Liang</p>
          <p>All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>

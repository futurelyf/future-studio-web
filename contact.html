<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ✅ FIX #2: title simplified to just "Contact" -->
    <title>Contact</title>
    <link rel="icon" type="image/svg+xml" href="Tree.svg" />
    <link rel="stylesheet" href="style.css" />
    <script>
      (function () {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <header class="navbar">
      <div class="navbar__inner">
        <a href="/index.html" class="brand">
          <img src="Tree.svg" alt="Future Studio logo" class="brand__logo" />
          <span class="brand__name">Future Studio</span>
        </a>
        <nav class="navbar__links">
          <a href="/index.html">Home</a>
          <a href="/contact.html">Contact</a>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle dark or light mode"
          >
            <svg
              class="icon icon--sun"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg
              class="icon icon--moon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="contact">
      <div class="contact__intro">
        <h1 class="contact__title">
          Let's connect
          <span class="contact__wave" aria-hidden="true">👋</span>
        </h1>
        <p class="contact__desc">
          Have a question, project, or just want to say hi?<br />
          Fill out the form below and I'll get back to you.
        </p>
      </div>

      <div class="contact__frame">
        <iframe
          src="https://form.futurestudio.dev/web-contact-jeRpNhaPRvmV_qB9CAA7WA?v=o"
          title="Contact form"
          loading="lazy"
          allow="clipboard-write"
        >
        </iframe>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer__box">
        <a href="/index.html" class="brand">
          <img src="Tree.svg" alt="Future Studio logo" class="brand__logo" />
          <span class="brand__name">Future Studio</span>
        </a>
        <div class="footer__text">
          <p>Future Studio</p>
          <p>© <span class="year"></span> Yifan Liang</p>
          <p>All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
